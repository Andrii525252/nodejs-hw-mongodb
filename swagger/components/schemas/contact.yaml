type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - isFavourite
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: number
    example: +380000000005
  contactType:
    description: 'Contacts type'
    type: string
    enum: ['work', 'home', 'personal']
  isFavourite:
    description: 'Favourite status'
    type: boolean
    example: false
  parentId:
    description: "Contacts's parent id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contacts's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
